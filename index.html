<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="./script/login.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body class="d-flex align-items-center justify-content-center vh-100 bg-light">
    <div class="card p-4 shadow-sm" style="width: 100%; max-width: 400px;">
        <h2 class="text-center mb-4">Login Menu</h2>
        
        <div class="mb-3">
            <input type="text" id="username" class="form-control" placeholder="Username" aria-label="Username">
        </div>
        
        <div class="mb-3">
            <input type="password" id="password" class="form-control" placeholder="Password" aria-label="Password">
        </div>
        
        <button type="button" class="btn btn-primary w-100 mb-3" id="login">Login</button>
        
        <div class="text-center">
            <a href="./templates/register.html" class="text-decoration-none">Don't have an account yet? Click here to sign up</a>
        </div>
    </div>
</body>
</html>
