<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="../script/register.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-light py-4">
    <div class="card p-4 shadow-sm" style="width: 100%; max-width: 450px;">
        <h2 class="text-center mb-4">Registration Menu</h2>

        <div class="mb-3">
            <input type="text" id="idnum" class="form-control" placeholder="Enter ID Number">
        </div>

        <div class="mb-3">
            <input type="text" id="lastn" class="form-control" placeholder="Enter Last Name">
        </div>

        <div class="mb-3">
            <input type="text" id="firstn" class="form-control" placeholder="Enter First Name">
        </div>

        <div class="mb-3">
            <input type="text" id="contact" class="form-control" placeholder="Enter Contact Number">
        </div>

        <div class="mb-3">
            <input type="email" id="email" class="form-control" placeholder="Enter Email Address">
        </div>

        <div class="mb-3">
            <input type="text" id="username" class="form-control" placeholder="Enter Username">
        </div>

        <div class="mb-3">
            <input type="password" id="password" class="form-control" placeholder="Enter Password">
        </div>

        <div class="mb-3">
            <select name="" id="department" class="form-select">
                <option value="">Select your department</option>
            </select>
        </div>

        <button type="button" class="btn btn-success w-100 mb-3" id="register">Register</button>

        <div class="text-center">
            <a href="../index.html" class="text-decoration-none">Already have an account? Click here to login</a>
        </div>
    </div>
</body>
</html>
