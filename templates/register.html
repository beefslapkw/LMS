<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="../script/register.js"></script>
</head>
<body>
    <h2>Registration Menu</h2>
    <input type="text" id="idnum" placeholder="Enter ID Number"> <br>
    <input type="text" id="lastn" placeholder="Enter Last Name"> <br>
    <input type="text" id="firstn" placeholder="Enter First Name"> <br>
    <input type="text" id="contact" placeholder="Enter Contact Number"> <br>
    <input type="email" id="email" placeholder="Enter Email Address"> <br>
    <input type="text" id="username" placeholder="Enter Username"> <br>
    <input type="password" id="password" placeholder="Enter Password"> <br>
    <select name="" id="department">
        <option value="">Select your department</option>
    </select> <br>
    <button id="register">Register</button> <br>
    <a href="../index.html">Already have an account? Click here to login</a>
</body>
</html>
